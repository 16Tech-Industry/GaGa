<h2>Lista de Usuarios Registrados</h2>

<div class="top-controls">
  <input type="text" class="buscador" placeholder="Buscar...">
  
  <div class="action-buttons">
    <button class="square-button add-button">Agregar</button>
  </div>
</div>

<table class="table">
  <thead>
    <tr>
      <th>ID</th>
      <th>Nombre</th>
      <th>Email</th>
      <th>Empresa</th>
      <th></th>
    </tr>
  </thead>
  <tbody class="table-group-divider">
    <tr *ngFor="let usuario of usuarios">
      <th scope="row">{{ usuario.id }}</th>
      <td>{{ usuario.nombre }}</td>
      <td>{{ usuario.email }}</td>
      <td>{{ usuario.empresa }}</td>
      <td>
        <div class="action-buttons">
          <button class="square-button edit-button">Editar</button>
          <button class="square-button delete-button">Borrar</button>
        </div>
      </td>  
    </tr>
  </tbody>
</table>
