<h2>Lista de Centrales Registradas</h2>
<div class="top-controls">
  <input type="text" class="buscador" placeholder="Buscar...">

  <div class="action-buttons">
    <button class="square-button add-button" (click)="agregarCentral()">Agregar</button>
      <!-- Al hacer clic ejecuta el método agregarCentral() del componente TS -->
  </div>
</div>

<table class="table">
  <thead>
    <tr>
      <th>Nombre</th>
      <th>ID</th>
      <th>Ubicacion</th>
      <th>Empresa</th>
      <th></th>
    </tr>
  </thead>
  <tbody class="table-group-divider">
    <!-- 🔁 Itera sobre la lista de 'centrales' proveniente del componente TypeScript -->
    <!-- La función centrales() devuelve un arreglo de objetos 'central' -->
    <tr *ngFor="let central of centrales()">
      <td>{{ central.nombre }}</td> <th scope="row">{{ central.id }}</th>
      <td>{{ central.Ubicacion }}</td>
      <td>{{ central.empresa }}</td>
      <td>
        <div class="action-buttons">
          <!-- Llama al método editarCentral() pasando el objeto 'central' como parámetro -->
          <button class="square-button edit-button" (click)="editarCentral(central)">Editar</button>
          <button class="square-button delete-button" (click)="borrarCentral(central)">Borrar</button>
        </div>
      </td>
    </tr>
  </tbody>
</table>
