<h2 mat-dialog-title>Registro de Usuario</h2>
<mat-dialog-content>
  <p>Por favor, ingrese los datos del nuevo usuario:</p>
  <mat-form-field>
    <mat-label>Nombre</mat-label>
    <input matInput [(ngModel)]="nombre" />
  </mat-form-field>
  <mat-form-field>
    <mat-label>Apellido</mat-label>
    <input matInput [(ngModel)]="apellido" />
  </mat-form-field>
  <mat-form-field>
    <mat-label>Correo Electrónico</mat-label>
    <input matInput [(ngModel)]="email" />
  </mat-form-field>
  <mat-form-field>
    <mat-label>CUIT de Empresa</mat-label>
    <input matInput [(ngModel)]="cuitEmpresa" />
  </mat-form-field>
</mat-dialog-content>
<mat-dialog-actions>
  <button mat-button (click)="onNoClick()">Cancelar</button>
<button mat-button [mat-dialog-close]="{
  nombre: nombre,
  apellido: apellido,
  email: email,
  cuitEmpresa: cuitEmpresa
}" cdkFocusInitial>Guardar</button>
</mat-dialog-actions>
