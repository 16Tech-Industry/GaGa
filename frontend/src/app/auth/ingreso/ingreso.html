<div class="text-center">
    <main class="form-signin">
        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
            <h2 class="registro-tit">Ingresar</h2>
            <div class="contenedor-registro">
                <label for="email"> Usuario: </label>
                <input type="email" formControlName="email" class="form-control" placeholder="Ingrese su email" required [class.error]="hasError('email')">
                <label for="contrasenia">Contraseña:</label>
                <input type="password" formControlName="contrasenia" class="form-control" minlength="5" maxlength="12" placeholder="Ingrese Contraseña" required [class.error]="hasError('contrasenia')">
            <div class="checkbox mb-3">
                <label>
                    <input type="checkbox" value="Recordarme"> Recordarme
                </label>
            </div>
            <button class="btn btn-primary btn-registro" type="submit" [disabled]="isLoading" [class.disabled]="isLoading">
                    Iniciar Sesión
            </button>
        </div>
        </form>
    </main>
</div>
